{% extends 'shop/base.html' %}
{% block content %}
<div class="row bg-white p-4 rounded shadow-sm">
<div class="col-md-6">
{% if product.image %}<img src="{{ product.image.url }}" class="img-fluid rounded">{% endif %}
</div>
<div class="col-md-6">
<h2>{{ product.title }}</h2>
<p class="text-muted">{{ product.category.name }}</p>
<h3 class="text-primary">R{{ product.price }}</h3>
<p><strong>Size:</strong> {{ product.size }} | <strong>Stock:</strong> {{ product.stock }}</p>
<p>{{ product.description }}</p>
<a href="/add-to-cart/{{ product.id }}/" class="btn btn-primary btn-lg w-100">Add to Cart 🛒</a>
<a href="/" class="btn btn-outline-secondary mt-2 w-100">Back to Shop</a>
</div>
</div>
{% endblock %}
